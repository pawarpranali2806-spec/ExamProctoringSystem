{% extends 'base.html' %}

{% block title %}404 - Resource Not Located{% endblock %}

{% block content %}
<div class="container" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 200px); text-align: center;">
  <div class="glass-card" style="padding: 3rem; max-width: 500px;">
    <div style="font-size: 3.5rem; font-weight: 900; color: var(--accent-cyan); font-family: 'JetBrains Mono', monospace; margin-bottom: 1rem;">404</div>
    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Access Target Not Found</h2>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem;">The examination route or resource you requested does not exist or has been relocated.</p>
    <a href="{{ url_for('landing') }}" class="btn btn-primary">Return to Safety</a>
  </div>
</div>
{% endblock %}
