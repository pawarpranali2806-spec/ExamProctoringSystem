{% extends 'base.html' %}

{% block title %}Create Account{% endblock %}

{% block content %}
<div class="container" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 160px); padding-top: 2rem; padding-bottom: 2rem;">
  <div class="glass-card" style="width: 100%; max-width: 480px; padding: 2.5rem;">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.4rem;">
        <i class="fa-solid fa-user-plus" style="color:#050811;"></i>
      </div>
      <h2 style="font-size: 1.75rem; margin-bottom: 0.5rem;">Create Account</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Join Project Panopticon proctoring platform</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label class="form-label" for="full_name">Full Legal Name</label>
        <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Alex Mercer" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="alexmercer" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Institutional Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="alex@university.edu" required>
      </div>

      <div class="grid-2" style="gap: 1rem; margin-bottom: 0;">
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Min. 6 chars" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="role">Account Role</label>
        <select id="role" name="role" class="form-control" style="background: #0e1526; cursor: pointer;">
          <option value="student" selected>Student / Candidate</option>
          <option value="admin">Administrator / Examiner</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem; margin-top: 0.5rem;">
        <i class="fa-solid fa-check"></i> Register Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid var(--border-subtle); padding-top: 1.25rem;">
      Already registered? <a href="{{ url_for('auth.login') }}">Sign in here</a>
    </div>

  </div>
</div>
{% endblock %}
